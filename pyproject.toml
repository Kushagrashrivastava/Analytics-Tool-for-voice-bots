[project]
name = "aster-vale"
version = "1.0.0"
description = "Call-transcript disposition labelling (Groq LLM evidence extraction + deterministic policy rules) and rule-based gender detection"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai==1.109.1",
    "pydantic==2.11.9",
    "tenacity==9.1.2",
    "tzdata==2025.2",
    "python-dotenv==1.1.1",
]

[project.optional-dependencies]
web = ["streamlit==1.50.0", "plotly==6.3.0", "pandas==2.3.3"]
dev = ["pytest==8.4.2", "ruff==0.13.2"]

[project.scripts]
aster-vale = "aster_vale.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aster_vale"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
